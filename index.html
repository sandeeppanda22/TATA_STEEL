<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant RoadWorks Pro</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--bd:#e2e8f0;--text:#0f172a;--mut:#64748b;--pri:#0284c7;--ok:#059669;--warn:#d97706;--bad:#dc2626;--purple:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;padding:14px 24px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,#0284c7,#38bdf8);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(2,132,199,.3)}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}.brand p{font-size:.8rem;color:var(--mut)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s;border:1px solid transparent}
.btn-p{background:var(--pri);color:#fff}.btn-p:hover{background:#0369a1;transform:translateY(-1px)}
.btn-w{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3);color:#b45309}.btn-w:hover{background:rgba(245,158,11,.25)}
.btn-o{background:#fff;border-color:#cbd5e1;color:var(--text)}.btn-o:hover{background:#f1f5f9}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tabs{display:flex;gap:8px;margin-top:14px;border-top:1px solid rgba(0,0,0,.06);padding-top:10px;overflow-x:auto}
.tab{background:transparent;border:none;color:var(--mut);padding:8px 14px;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--text);background:rgba(0,0,0,.04)}.tab.on{color:var(--pri);background:rgba(2,132,199,.1)}
.badge{background:var(--bad);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:10px;font-weight:700}
main{padding:24px;max-width:1440px;margin:0 auto}
.pane{display:none}.pane.on{display:block;animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#b45309;padding:10px 16px;font-size:.85rem;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;width:4px;height:100%}
.kpi.b:before{background:var(--pri)}.kpi.g:before{background:var(--ok)}.kpi.r:before{background:var(--bad)}.kpi.p:before{background:var(--purple)}
.kpi .l{font-size:.78rem;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:1.85rem;font-weight:800;margin-top:8px}.kpi .s{font-size:.78rem;color:var(--mut);margin-top:6px}
.pb{width:100%;height:8px;background:#e2e8f0;border-radius:4px;margin-top:10px;overflow:hidden;position:relative;overflow:visible}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#0284c7,#059669);border-radius:4px;transition:width .4s}
.pb b{position:absolute;top:-3px;width:2px;height:14px;background:#d97706;border-radius:1px}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea{background:#fff;border:1px solid #cbd5e1;color:var(--text);padding:8px 12px;border-radius:6px;font-size:.85rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
input[type=date]{color-scheme:light}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.rc:hover{border-color:#cbd5e1;transform:translateY(-2px);box-shadow:0 10px 25px rgba(15,23,42,.1)}
.rh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.code{font-size:1.1rem;font-weight:700;color:var(--pri)}
.title{font-size:.85rem;font-weight:600;line-height:1.35;margin-bottom:10px;color:#1e293b;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem;color:var(--mut);background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:14px}
.specs strong{color:#1e293b}
.meta{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px}
.ra{display:flex;gap:8px;margin-top:14px}.ra .btn{flex:1;justify-content:center}
.pill{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:12px;display:inline-flex;gap:4px;white-space:nowrap}
.p-bad{background:rgba(239,68,68,.18);color:#b91c1c;border:1px solid rgba(239,68,68,.4)}
.p-ok{background:rgba(16,185,129,.15);color:#047857;border:1px solid rgba(16,185,129,.35)}
.p-mut{background:#f1f5f9;color:var(--mut);border:1px solid #cbd5e1}
.p-warn{background:rgba(245,158,11,.15);color:#b45309;border:1px solid rgba(245,158,11,.35)}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;text-align:left}
th{background:#f8fafc;padding:12px 14px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.06);vertical-align:middle}
tr:hover td{background:rgba(0,0,0,.02)}
td.n,th.n{text-align:right;white-space:nowrap}
td input[type=number],td input[type=text]{width:100%;padding:6px 8px}td input[type=number]{width:120px}
.mini{display:flex;align-items:center;gap:8px}.mini .pb{width:90px;margin:0;height:8px}
.bn{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bad);border-radius:10px;padding:16px;margin-bottom:14px}
.bn.ip{border-left-color:var(--warn)}.bn.cl{border-left-color:var(--ok);opacity:.75}
.bn h3{font-size:1rem;margin-bottom:8px;line-height:1.4}.bn .m{font-size:.8rem;color:var(--mut);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:14px}
.bn .m strong{color:#1e293b}.bn .rm{font-size:.85rem;background:#f8fafc;padding:10px;border-radius:6px;margin-bottom:12px;color:#334155}
.bn .ac{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.note{font-size:.78rem;color:var(--mut);margin:10px 0 18px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:1.1rem}
.mb{padding:20px;overflow-y:auto}.mf{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px}
.x{background:none;border:none;color:var(--mut);font-size:1.5rem;cursor:pointer}
.fg{margin-bottom:14px}.fg label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:#334155}.fg input,.fg select,.fg textarea{width:100%}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:18px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}.cc.wide{grid-column:1/-1}
.cc h3{font-size:.95rem;margin-bottom:12px}.cc svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin-top:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.dn{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.dn svg{width:190px;flex:none}.dn ul{list-style:none;font-size:.85rem;line-height:2}
@media print{.cg{display:block}.cc{break-inside:avoid;margin-bottom:12px}}
.dt{width:125px!important}.dt.bad{border-color:var(--bad)!important}
@media print{header .actions,.bar,.ra,.tabs,#banner{display:none!important}body{background:#fff;color:#000}.pane{display:block!important}}
</style>
</head>

</header>

  const entries = [...document.querySelectorAll('#t-entry input[data-id]')].filter(i => i.value !== '').map(i => ({activity_id: i.dataset.id, qty: +i.value, remarks: $('#rm_' + i.dataset.id).value.trim(), prev: i.dataset.prev}));

  const low = entries.filter(e => e.prev !== '' && e.qty < +e.prev);
  if (low.length && !confirm(`${low.map(e => e.activity_id).join(', ')}: lower than the previous cumulative quantity.\nSave anyway?`)) return;
  try { await api('/api/progress', {week: w, entries}); await load(); alert(`${entries.length} entries saved for week ending ${fmt(w)}.`); } catch (e) { alert(e.message); }
}

function bnTab() {
  const roads = [...new Set(S.activities.map(a => a.road_no))].sort((a, b) => a - b), f = $('#bf')?.value || 'open';
  const list = S.bottlenecks.filter(b => f === 'all' || (f === 'open' ? isOpen(b) : !isOpen(b)));
  const info = Object.fromEntries(S.activities.map(a => [a.road_no, a]));
  $('#t-bn').innerHTML = `<div class="bar"><div class="grp"><select id="bf" onchange="bnTab()"><option value="open" ${f === 'open' ? 'selected' : ''}>Open / in progress</option><option value="closed" ${f === 'closed' ? 'selected' : ''}>Closed</option><option value="all" ${f === 'all' ? 'selected' : ''}>All</option></select></div>
    <button class="btn btn-w" ${RO ? 'disabled' : ''} onclick="addBn()">⚠️ Report bottleneck</button></div>` +
    (list.map(b => { const a = info[b.road_no], cls = /closed|resolved/i.test(b.status) ? 'cl' : /progress/i.test(b.status) ? 'ip' : '';
      return `<div class="bn ${cls}"><h3>${esc(b.issue)}</h3><div class="m"><span>Road <strong>${esc(b.road_no)}</strong></span><span>Vendor: <strong>${esc(a?.vendor || '–')}</strong></span><span>Manager: <strong>${esc(a?.line_manager || '–')}</strong></span><span>Source: <strong>${esc(b.source)}</strong></span></div>
      ${b.remarks ? `<div class="rm">${esc(b.remarks)}</div>` : ''}
      <div class="ac"><div><label style="font-size:.75rem;color:var(--mut);margin-right:6px">Status</label><select ${RO ? 'disabled' : ''} onchange="bnOp({op:'status',id:'${b.id}',status:this.value})">${['Open', 'In progress', 'Closed'].map(s => `<option ${s.toLowerCase() === b.status.toLowerCase() ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div style="display:flex;gap:8px"><button class="btn btn-o" ${RO ? 'disabled' : ''} onclick="bnRemarks('${b.id}')">Remarks</button><button class="btn btn-o" ${RO ? 'disabled' : ''} onclick="bnDel('${b.id}')">Delete</button></div></div></div>`; }).join('') || '<div class="empty">No bottlenecks in this view.</div>');
  window._roads = roads;
}
async function bnOp(b) { try { await api('/api/bottleneck', b); await load(); } catch (e) { alert(e.message); } }
function bnRemarks(id) { const b = S.bottlenecks.find(x => x.id === id), t = prompt('Remarks:', b.remarks); if (t !== null) bnOp({op: 'remarks', id, remarks: t}); }
function bnDel(id) { if (confirm('Delete ' + id + '?')) bnOp({op: 'delete', id}); }
function addBn() {
  const roads = [...new Set(S.activities.map(a => a.road_no))].sort((a, b) => a - b);
  modal('Report bottleneck', `<div class="fg"><label>Road</label><select id="nr">${roads.map(r => `<option value="${r}">Road ${r}</option>`).join('')}</select></div><div class="fg"><label>Issue</label><textarea id="ni" rows="3" placeholder="Describe the issue"></textarea></div>`,
    `<button class="btn btn-o" onclick="closeM()">Cancel</button><button class="btn btn-w" onclick="(async()=>{const i=$('#ni').value.trim();if(!i)return alert('Issue is required.');await bnOp({op:'add',road_no:+$('#nr').value,issue:i});closeM();})()">Submit</button>`);
}

function grpTab(id, title, key) {
  const acts = compute(), g = groupBy(acts, key);
  const openBy = k => S.bottlenecks.filter(b => isOpen(b) && S.activities.find(a => a.road_no == b.road_no)?.[key] === k).length;
  $('#t-' + id).innerHTML = `<div class="tc"><table><tr><th>${title}</th><th>Roads</th><th class="n">Activities</th><th>Progress</th><th class="n">Actual</th><th class="n">Planned</th><th>Status</th><th class="n">Open bottlenecks</th></tr>` +
    Object.keys(g).sort().map(k => { const s = sum(g[k]), [t, c] = stat(s), roads = [...new Set(g[k].map(a => a.road_no))].sort((a, b) => a - b);
      return `<tr><td><b>${esc(k)}</b></td><td>${roads.map(r => 'R' + r).join(', ')}</td><td class="n">${s.n}</td><td><div class="mini">${bar(s.pct, s.plan)}</div></td><td class="n">${s.pct.toFixed(1)}%</td><td class="n">${s.plan == null ? '–' : s.plan.toFixed(1) + '%'}</td><td><span class="pill ${c}">${t}</span></td><td class="n">${openBy(k)}</td></tr>`; }).join('') + `</table></div>
    <div class="note">Progress = average of activity % (cumulative ÷ planned, max 100). Each activity counts equally. "Not stated" means the sheet does not name one.</div>`;
}

let DE = {}, DF = {road: '', bad: false};
function dates() {
  const acts = compute(), roads = [...new Set(S.activities.map(a => a.road_no))].sort((a, b) => a - b);
  const list = acts.filter(a => (!DF.road || a.road_no == DF.road) && (!DF.bad || a.issue)), nBad = acts.filter(a => a.issue).length;
  const cnt = Object.keys(DE).length;
  $('#t-dates').innerHTML = `<div class="bar"><div class="grp">
      <select id="dr"><option value="">All roads</option>${roads.map(r => `<option value="${r}" ${r == DF.road ? 'selected' : ''}>Road ${r}</option>`).join('')}</select>
      <label style="font-size:.85rem;color:var(--mut)"><input type="checkbox" id="db" ${DF.bad ? 'checked' : ''}> Problems only (${nBad})</label>
      <span style="font-size:.8rem;color:var(--mut)">Edit any date as dd-mm-yyyy, then save.</span></div>
      <button class="btn btn-p" id="dsave" ${RO ? 'disabled' : ''} onclick="saveDates()">💾 Save date changes${cnt ? ' (' + cnt + ')' : ''}</button></div>
    <div class="tc"><table><tr><th>ID</th><th>Road</th><th>Activity</th><th>Start date</th><th>End date</th><th>Problem</th></tr>` +
    list.map(a => { const v = DE[a.activity_id] || {s: fmt(a.start_date), e: fmt(a.end_date)};
      return `<tr><td>${a.activity_id}</td><td>Road ${a.road_no}</td><td>${esc(a.activity)}</td>
      <td><input class="dt" type="text" id="ds_${a.activity_id}" value="${esc(v.s)}" placeholder="dd-mm-yyyy" oninput="dateEdit('${a.activity_id}')" ${RO ? 'disabled' : ''}></td>
      <td><input class="dt" type="text" id="de_${a.activity_id}" value="${esc(v.e)}" placeholder="dd-mm-yyyy" oninput="dateEdit('${a.activity_id}')" ${RO ? 'disabled' : ''}></td>
      <td id="dp_${a.activity_id}">${a.issue ? `<span class="pill p-warn">${a.issue}</span>` : ''}</td></tr>`; }).join('') + `</table></div>`;
  $('#dr').onchange = e => { DF.road = e.target.value; dates(); }; $('#db').onchange = e => { DF.bad = e.target.checked; dates(); };
  list.forEach(a => DE[a.activity_id] && dateEdit(a.activity_id, true));
}
function dateEdit(id, keep) {
  const a = S.activities.find(x => x.activity_id === id), si = $('#ds_' + id), ei = $('#de_' + id), s = toISO(si.value), e = toISO(ei.value);
  const why = !s ? 'start is not a valid date' : !e ? 'end is not a valid date' : e < s ? 'end before start' : '';
  si.classList.toggle('bad', !s || (!!e && e < s)); ei.classList.toggle('bad', !e || (!!s && e < s));
  $('#dp_' + id).innerHTML = why ? `<span class="pill p-warn">${why}</span>` : '';
  if (!keep) { if (si.value === fmt(a.start_date) && ei.value === fmt(a.end_date)) delete DE[id]; else DE[id] = {s: si.value, e: ei.value}; }
  const n = Object.keys(DE).length, b = $('#dsave'); if (b) b.textContent = '💾 Save date changes' + (n ? ` (${n})` : '');
}
async function saveDates() {
  const items = [], bad = [];
  for (const [id, v] of Object.entries(DE)) { const s = toISO(v.s), e = toISO(v.e); if (!s || !e || e < s) bad.push(id); else items.push({activity_id: id, start: s, end: e}); }
  if (bad.length) return alert('Fix these first (dd-mm-yyyy, and end date not before start date):\n' + bad.join(', '));
  if (!items.length) return alert('No date changes to save.');
  try { await api('/api/dates_bulk', {items}); DE = {}; await load(); alert(`${items.length} activities updated.`); } catch (e) { alert('Nothing was saved.\n\n' + e.message); }
}


const COL = {act: '#0284c7', plan: '#f59e0b'};
function barChart(items) {
  const L = 150, W = 640, R = 56, rh = 30, H = items.length * rh + 26, pw = W - L - R; let g = '';
  [0, 25, 50, 75, 100].forEach(t => { const x = L + pw * t / 100; g += `<line x1="${x}" x2="${x}" y1="0" y2="${H - 22}" stroke="#e2e8f0"/><text x="${x}" y="${H - 7}" fill="#64748b" font-size="10" text-anchor="middle">${t}%</text>`; });
  items.forEach((it, i) => { const y = i * rh + 4;
    g += `<text x="${L - 8}" y="${y + 15}" fill="#1e293b" font-size="11" text-anchor="end">${esc(it.label)}</text>` +
      `<rect x="${L}" y="${y}" width="${Math.max(0, pw * it.pct / 100)}" height="9" rx="2" fill="${COL.act}"><title>${esc(it.label)}: actual ${it.pct.toFixed(1)}%</title></rect>` +
      `<text x="${L + pw * it.pct / 100 + 5}" y="${y + 8}" fill="#64748b" font-size="9">${it.pct.toFixed(0)}%</text>`;
    if (it.plan != null) g += `<rect x="${L}" y="${y + 11}" width="${pw * it.plan / 100}" height="9" rx="2" fill="${COL.plan}"><title>${esc(it.label)}: planned ${it.plan.toFixed(1)}%</title></rect><text x="${L + pw * it.plan / 100 + 5}" y="${y + 19}" fill="#64748b" font-size="9">${it.plan.toFixed(0)}%</text>`;
    else g += `<text x="${L + 5}" y="${y + 19}" fill="#64748b" font-size="9">no schedule</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donut(parts) {
  const tot = parts.reduce((s, p) => s + p.n, 0) || 1, r = 60, C = 2 * Math.PI * r; let off = 0;
  const arcs = parts.map(p => { const len = C * p.n / tot, s = `<circle r="${r}" cx="90" cy="90" fill="none" stroke="${p.color}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${p.label}: ${p.n}</title></circle>`; off += len; return s; }).join('');
  return `<div class="dn"><svg viewBox="0 0 180 180"><circle r="${r}" cx="90" cy="90" fill="none" stroke="#e2e8f0" stroke-width="26"/>${arcs}<text x="90" y="88" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="800">${tot === 1 && !parts.some(p => p.n) ? 0 : parts.reduce((s, p) => s + p.n, 0)}</text><text x="90" y="106" text-anchor="middle" fill="#64748b" font-size="10">activities</text></svg>
    <ul>${parts.map(p => `<li><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.color};margin-right:8px"></span>${p.label}: <b>${p.n}</b></li>`).join('')}</ul></div>`;
}
function sCurve() {
  const sched = S.activities.map(a => ({s: day(a.start_date), e: day(a.end_date)})).filter(x => !isNaN(x.s) && !isNaN(x.e) && x.e >= x.s);
  if (!sched.length) return '<div class="empty">No usable schedule dates.</div>';
  const weeks = [...new Set(S.progress.map(p => p.week_ending))].sort(), wt = weeks.map(day).filter(x => !isNaN(x)), step = 7 * 864e5;
  const t0 = Math.min(...sched.map(x => x.s), ...wt), t1 = Math.max(...sched.map(x => x.e), ...wt);
  const plan = t => avg(sched.map(x => t <= x.s ? 0 : t >= x.e ? 100 : (t - x.s) / (x.e - x.s) * 100));
  const W = 760, H = 300, L = 42, R = 16, T = 12, B = 34, pw = W - L - R, ph = H - T - B, X = t => L + pw * (t - t0) / (t1 - t0), Y = p => T + ph * (1 - p / 100); let g = '';
  [0, 25, 50, 75, 100].forEach(p => g += `<line x1="${L}" x2="${W - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#e2e8f0"/><text x="${L - 6}" y="${Y(p) + 3}" fill="#64748b" font-size="10" text-anchor="end">${p}%</text>`);
  const d0 = new Date(t0); for (let d = new Date(Date.UTC(d0.getUTCFullYear(), Math.ceil(d0.getUTCMonth() / 3) * 3, 1)); d.getTime() <= t1; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 3, 1)))
    g += `<line x1="${X(d.getTime())}" x2="${X(d.getTime())}" y1="${T}" y2="${T + ph}" stroke="#e2e8f0"/><text x="${X(d.getTime())}" y="${H - 14}" fill="#64748b" font-size="10" text-anchor="middle">${d.toLocaleString('en', {month: 'short', year: '2-digit', timeZone: 'UTC'})}</text>`;
  let pp = ''; for (let t = t0; ; t += step) { const tt = Math.min(t, t1); pp += (pp ? 'L' : 'M') + X(tt).toFixed(1) + ' ' + Y(plan(tt)).toFixed(1); if (tt >= t1) break; }
  g += `<path d="${pp}" fill="none" stroke="${COL.plan}" stroke-width="2.5"/>`;
  const sel = day(week()); if (!isNaN(sel) && sel >= t0 && sel <= t1) g += `<line x1="${X(sel)}" x2="${X(sel)}" y1="${T}" y2="${T + ph}" stroke="#64748b" stroke-dasharray="4 4"/><text x="${X(sel)}" y="${T + 10}" fill="#64748b" font-size="10" dx="4">${fmt(week())}</text>`;
  const pts = weeks.map(w => ({t: day(w), p: avg(compute(w).map(a => a.pct)), w})).filter(x => !isNaN(x.t));
  if (pts.length) g += `<path d="${pts.map((q, i) => (i ? 'L' : 'M') + X(q.t).toFixed(1) + ' ' + Y(q.p).toFixed(1)).join('')}" fill="none" stroke="${COL.act}" stroke-width="2.5"/>` + pts.map(q => `<circle cx="${X(q.t)}" cy="${Y(q.p)}" r="4" fill="${COL.act}"><title>${q.w}: ${q.p.toFixed(1)}%</title></circle>`).join('');
  else g += `<text x="${W / 2}" y="${T + ph / 2}" text-anchor="middle" fill="#64748b" font-size="12">Actual line appears once weekly progress is saved</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function charts() {
  const acts = compute(), grp = (k, f = x => x) => Object.entries(groupBy(acts, k)).sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, {numeric: true})).map(([n, l]) => { const s = sum(l); return {label: f(n), pct: s.pct, plan: s.plan}; });
  const done = acts.filter(a => a.pct >= 100).length, started = acts.filter(a => a.pct > 0 && a.pct < 100).length;
  const lg = `<div class="lg"><span><i style="background:${COL.act}"></i>Actual</span><span><i style="background:${COL.plan}"></i>Planned (from start/end dates)</span></div>`;
  $('#t-charts').innerHTML = `<div class="cg">
    <div class="cc wide"><h3>Overall progress over time (S-curve)</h3>${sCurve()}${lg}</div>
    <div class="cc"><h3>Activity status at ${fmt(week())}</h3>${donut([{label: 'Complete', n: done, color: '#10b981'}, {label: 'In progress', n: started, color: COL.act}, {label: 'Not started', n: acts.length - done - started, color: '#334155'}])}</div>
    <div class="cc"><h3>By vendor</h3>${barChart(grp('vendor'))}${lg}</div>
    <div class="cc"><h3>By line manager</h3>${barChart(grp('line_manager'))}${lg}</div>
    <div class="cc wide"><h3>By road</h3>${barChart(grp('road_no', n => 'Road ' + n))}${lg}</div></div>
    <div class="note">Charts use the week selected at the top. Planned % comes from each activity's start and end dates as entered; activities with unusable dates (see the Dates tab) are left out of the planned line. Each activity counts equally.</div>`;
}
async function reloadCsv() {
  if (!confirm('Re-read plan.csv and bottlenecks.csv?\n\nRows with the same ID are overwritten by the CSV values. Saved weekly progress is not touched.')) return;
  try {
    const r = await api('/api/reload', {}); await load();
    alert(`Plan: ${r.added} added, ${r.updated} updated` + (r.kept ? `, ${r.kept} in the app but not in the CSV (left unchanged)` : '') + `.\nBottlenecks: ${r.bn_added} added, ${r.bn_updated} updated.`);
  } catch (e) { alert('Reload cancelled, nothing changed.\n\n' + e.message); }
}
async function importProgress(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  try {
    const r = await api('/api/import_progress', {csv: await f.text()}); await load();
    alert(`${r.imported} rows imported.` + (r.lower_than_previous.length ? `\n\nLower than the previous cumulative quantity: ${r.lower_than_previous.join(', ')}` : ''));
  } catch (e) { alert('Import cancelled, nothing changed.\n\n' + e.message); }
}
function exportCsv() {
  if (!RO) return location.href = '/api/export/summary?week=' + week();
  const acts = compute(), q = v => `"${String(v).replace(/"/g, '""')}"`, rows = [['road', 'vendor', 'line_manager', 'activities', 'actual_pct', 'planned_pct']];
  Object.entries(groupBy(acts, 'road_no')).sort((a, b) => a[0] - b[0]).forEach(([r, l]) => { const s = sum(l); rows.push([`Road ${r}`, l[0].vendor, l[0].line_manager, s.n, s.pct.toFixed(1), s.plan == null ? '' : s.plan.toFixed(1)]); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(',')).join('\n')], {type: 'text/csv'})); a.download = `summary_${week()}.csv`; a.click();
}
function modal(t, body, foot) { $('#mt').textContent = t; $('#mbody').innerHTML = body; $('#mfoot').innerHTML = foot; $('#ov').classList.add('on'); }
function closeM() { $('#ov').classList.remove('on'); }
$('#ov').onclick = e => { if (e.target.id === 'ov') closeM(); };
$('#week').onchange = () => { const ok = !!week(); $('#week').style.borderColor = ok ? '' : 'var(--bad)'; if (ok) renderAll(); else alert('Enter the week ending as dd-mm-yyyy, e.g. 25-10-2026.'); };
$('#past').onchange = e => { if (e.target.value) { setWeek(e.target.value); renderAll(); } };
load();
</script>
</body>
